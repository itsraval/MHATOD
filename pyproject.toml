[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "mhatod"
version = "1.0.0"
description = "Malware Hash Analysis Tool for Open-source Data"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Alessandro Ravizzotti", email = "alessandro@ravizzotti.dev" }
]
keywords = ["malware", "analysis", "virustotal", "malwarebazaar", "avclass", "threat-intelligence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
mhatod = "MHATOD:main"

[project.urls]
Homepage = "https://github.com/itsraval/MHATOD"
Repository = "https://github.com/itsraval/MHATOD"
"Bug Tracker" = "https://github.com/itsraval/MHATOD/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
